name: Build & Deploy SupShare To Test

on:
  push:
    branches:
      - dev/v1.0.0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/supshare:latest .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/supshare:latest

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.TEST_DEPLOY_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H 65.109.13.102 >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run:  |
          ssh admin@65.109.13.102 << EOF
          cd supshare
          docker-compose down --remove-orphans
          docker image prune -af
          docker-compose pull
          docker-compose up -d
          EOF
